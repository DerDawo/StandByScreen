name: Android APK

on:
  push:
    # branches muss explizit stehen: sind nur tags gesetzt, laufen Branch-Pushes gar nicht
    branches:
      - "**"
    paths:
      - "android/**"
      - "index.html"
      - "script.js"
      - "styles.css"
      - "components/**"
      - "src/**"
      - "images/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk StandByScreen-${{ github.run_number }}.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: StandByScreen-apk
          path: android/StandByScreen-${{ github.run_number }}.apk

      - name: Release mit APK (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/StandByScreen-${{ github.run_number }}.apk

      - name: Feste Download-Datei vorbereiten
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp StandByScreen-${{ github.run_number }}.apk StandByScreen.apk

      - name: Aktuelle APK als Release "Neueste APK" veröffentlichen (bei jedem Push auf main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Neueste APK
          body: |
            Automatisch gebaut aus `main` (Commit ${{ github.sha }}, Build ${{ github.run_number }}).
            Direkter Download: https://github.com/${{ github.repository }}/releases/latest/download/StandByScreen.apk
          make_latest: true
          overwrite_files: true
          files: android/StandByScreen.apk
